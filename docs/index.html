cx.fillStyle='#889';cx.fillText('excess over sqrt(n)',m,14)}
cv.onmousemove=e=>{const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let best=null,bd=100;pts.forEach(p=>{const d=(p[0]-x)**2+(p[1]-y)**2;if(d<bd){bd=d;best=p}});
document.getElementById('tip').textContent=best?`n=${best[2][0]}  L=${best[2][1]}  excess=${(best[2][2]*100).toFixed(3)}%  tilted=${best[2][4]}  (${best[2][3]})`:'hover the chart'};
function table(){const rows=D.filter(r=>on[r[3]]).sort((a,b)=>(a[sortK]>b[sortK]?1:-1)*(asc?1:-1)).slice(0,200);
document.querySelector('#t tbody').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1].toFixed(5)}</td><td>${(r[2]*100).toFixed(3)}</td><td>${r[4]}</td><td><span class="tag" style="background:${css(r[3])}">${r[3]}</span></td></tr>`).join('')}
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=+th.dataset.k;asc=sortK==k?!asc:true;sortK=k;table()});
document.getElementById('q').oninput=e=>{const r=D.find(x=>x[0]==e.target.value);document.getElementById('res').innerHTML=r?`L=${r[1]} &middot; excess ${(r[2]*100).toFixed(3)}% &middot; ${r[4]} tilted &middot; <b style="color:${css(r[3])}">${r[3]}</b>`:''};
addEventListener('resize',draw);stats();draw();table();
</script></body></html>
